# Temporary: verifies the release GitHub App can push to tap + bucket.
# Run from the Actions tab (workflow_dispatch), then delete this file.
name: Test release auth

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: tsraveling
          repositories: homebrew-tap,scoop-bucket

      - name: Dry-run push to both repos
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          for repo in homebrew-tap scoop-bucket; do
            echo "--- $repo ---"
            git clone "https://x-access-token:${TOKEN}@github.com/tsraveling/${repo}.git" "$repo"
            cd "$repo"
            git config user.name test
            git config user.email test@example.com
            git commit --allow-empty -m "auth test (dry run, never pushed)"
            git push --dry-run origin HEAD
            cd ..
          done
          echo "✅ App token can push to both repos"
